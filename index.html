<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0f0f0f;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.gallery-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    width: 100%;
    max-width: 1100px;
}

.video-card {
    position: relative;
    display: block;
    overflow: hidden;
    border-radius: 12px;
    aspect-ratio: 16 / 9;
    background: #222;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
}

.video-thumbnail {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .4s;
}

.play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,.2);
    pointer-events: none;
}

.play-button {
    width: 65px;
    height: 65px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.play-icon {
    width: 0;
    height: 0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 20px solid #111;
    margin-left: 5px;
}

.video-card:hover .video-thumbnail {
    transform: scale(1.05);
}

.video-card:hover .play-button {
    background: red;
}

.video-card:hover .play-icon {
    border-left-color: white;
}

@media(max-width: 600px) {
    .gallery-container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
